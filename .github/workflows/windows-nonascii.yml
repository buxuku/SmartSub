name: Windows non-ASCII paths

# 中文 Windows 用户名下，默认安装目录、userData、%TEMP% 都含中文。原生库（sherpa-onnx、
# whisper.cpp 的音频解码）用窄字符 API 打开文件，在非 UTF-8 代码页下打不开这些路径：
#   - sherpa VAD 创建失败后只在 stderr 打印 `vad is nullptr`，不抛错，结果是 0 个语音段；
#   - sherpa writeWave 失败只返回 false；
#   - whisper 读不到音频时 Promise 仍 resolve，只是没有任何分段。
# ci.yml 只在 ubuntu 上跑，覆盖不到只会在 Windows 上出现的问题。
# 这里在 windows-latest 上用含中文的目录复现并验证。runner 的 ANSI 代码页通常是 1252，
# 不是中文系统的 936，但同属“窄字符 API 打不开含中文路径”这一类失败；脚本会打印实际的 ACP。
# 不使用任何 secrets，不发布任何产物。
on:
  push:
    branches:
      - 'fix/windows-nonascii-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-nonascii-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sherpa:
    name: sherpa-onnx with a non-ASCII path
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      # 不跑 postinstall：不需要 Electron 二进制，原生库由下面的脚本单独拉取
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Fetch sherpa-onnx native libraries
        run: node scripts/fetch-sherpa-native.mjs

      - name: Probe sherpa-onnx
        run: node scripts/windows-nonascii/probe-sherpa.mjs

  whisper:
    name: whisper.cpp addon with a non-ASCII path
    runs-on: windows-latest
    # 需要下载 addon 与模型，网络波动不应让整个 workflow 变红
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Fetch whisper.cpp addon
        run: node scripts/fetch-whisper-addon.mjs

      - name: Download ggml-tiny model
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o "$RUNNER_TEMP/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          ls -l "$RUNNER_TEMP/ggml-tiny.bin"

      - name: Probe whisper.cpp addon
        env:
          WHISPER_MODEL: ${{ runner.temp }}\ggml-tiny.bin
        run: node scripts/windows-nonascii/probe-whisper.mjs
