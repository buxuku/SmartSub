name: Build/release

on:
  push:
    tags:
      - 'v*'
  # 手动触发：Actions 页面点 "Run workflow"，并在 "Use workflow from" 选择要发布的 tag（如 v2.16.0）
  workflow_dispatch:
    inputs:
      signing_policy:
        description: '仅在分支上手动运行时生效：选 test-signing 用 SignPath 测试证书演练 Windows 签名流程（产物不会发布）。在 tag 上运行时忽略此项，是否签名由仓库变量 SIGNPATH_RELEASE_SIGNING 决定'
        type: choice
        options:
          - none
          - test-signing
        default: none

jobs:
  build_artifacts:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # SignPath 的 GitHub Action 要读取本次运行的 job 信息（actions: read）并校验源码来源（contents: read）。
    # 仓库默认的 GITHUB_TOKEN 是只读且不含 actions，所以这里显式声明。
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_BUILDER_HTTP_TIMEOUT: 6000000
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - os: macos-latest
            arch: arm64
            os_build_arg: mac
            build_args: '--arm64'
            artifact_suffix: macos-arm64

          # macOS Intel
          - os: macos-15-intel
            arch: x64
            os_build_arg: mac
            build_args: '--x64'
            artifact_suffix: macos-x64

          # Windows x64 (通用版本，不包含 CUDA)
          - os: windows-2022
            arch: x64
            os_build_arg: win
            artifact_suffix: windows-x64

          # Linux x64 (通用版本，不包含 CUDA)
          - os: ubuntu-22.04
            arch: x64
            os_build_arg: linux
            artifact_suffix: linux-x64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Prepare whisper addon (bundled)
        shell: bash
        run: node scripts/fetch-whisper-addon.mjs --arch=${{ matrix.arch }}

      - name: Inject build info
        shell: bash
        run: |
          case "${{ matrix.os_build_arg }}" in
            mac) export BUILD_PLATFORM=darwin ;;
            win) export BUILD_PLATFORM=win32 ;;
            *)   export BUILD_PLATFORM=linux ;;
          esac
          export BUILD_ARCH="${{ matrix.arch }}"
          node scripts/inject-build-info.js

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile application code
        run: yarn build # Assumes 'yarn build' compiles TS to JS, e.g., into the 'app' directory

      - name: Prepare sherpa native libs (bundled)
        shell: bash
        run: |
          yarn sherpa:fetch
          ls extraResources/sherpa/native

      - name: Build Electron app
        shell: bash
        run: |
          if [[ "${{ matrix.os_build_arg }}" == "mac" ]]; then
            export BUILD_PLATFORM="darwin"
          elif [[ "${{ matrix.os_build_arg }}" == "win" ]]; then
            export BUILD_PLATFORM="win32"
          else
            export BUILD_PLATFORM="linux"
          fi
          export BUILD_ARCH=${{ matrix.arch }}
          yarn run electron-builder --${{ matrix.os_build_arg }} --${{ matrix.arch }} ${{ matrix.build_args || '' }} --publish never

      - name: Bundle size gate (<=200MB)
        # Linux 安装包（AppImage/deb）天然偏大，豁免体积门禁；仅对 mac/win 强制。
        if: matrix.os_build_arg != 'linux'
        shell: bash
        run: yarn size:check

      # ---------------------------------------------------------------------------
      # Windows 安装包代码签名（SignPath Foundation 为开源项目免费提供证书）
      #
      # 默认关闭：不满足下面任一条件时，这一组步骤全部跳过，发布流程与之前完全一致。
      #   1. tag（v*）上运行，且仓库变量 SIGNPATH_RELEASE_SIGNING 为 true
      #      → 用 release-signing 策略。SignPath 会邮件通知审批人，批准后才继续，
      #        所以这里会一直等待；2 小时内没批准则本次失败，批准后重新运行即可。
      #   2. 分支上手动触发，且 signing_policy 选了 test-signing
      #      → 用 test-signing 策略（测试证书）演练整条链路。分支运行不会发布。
      # tag 上永远不会用 test-signing，所以测试证书签的包不可能被发布出去。
      #
      # 需要的配置：
      #   secrets.SIGNPATH_API_TOKEN     SignPath 的 CI 用户令牌
      #   vars.SIGNPATH_ORGANIZATION_ID  SignPath 组织 ID。它不是密钥，必须放 variables，
      #                                  放进 secrets 会被日志脱敏，SignPath 的链接会损坏
      #   vars.SIGNPATH_RELEASE_SIGNING  true 才对 tag 构建启用签名。
      #                                  必须等 release-signing 策略显示 VALID 之后再设置
      # SignPath 侧：项目 SmartSub，签名配置 installer（根是 zip-file，里面一个 pe-file）。
      #
      # 签名会改写安装包，所以签完要重算 latest.yml 里的 sha512，
      # 否则 electron-updater 校验失败，所有 Windows 用户都无法自动更新。
      # ---------------------------------------------------------------------------
      - name: Decide Windows signing policy
        id: signing
        if: matrix.os_build_arg == 'win'
        shell: bash
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RELEASE_SIGNING: ${{ vars.SIGNPATH_RELEASE_SIGNING }}
          DISPATCH_POLICY: ${{ inputs.signing_policy }}
        run: |
          policy=""
          case "$REF" in
            refs/tags/v*)
              # 发布构建：只会用正式证书，并且要仓库变量显式打开
              if [[ "$RELEASE_SIGNING" == "true" ]]; then
                policy="release-signing"
              fi
              ;;
            refs/tags/*)
              # 其它 tag 不会发布，也不签名
              ;;
            *)
              # 分支：只有手动触发并选了 test-signing 才演练
              if [[ "$EVENT" == "workflow_dispatch" && "$DISPATCH_POLICY" == "test-signing" ]]; then
                policy="test-signing"
              fi
              ;;
          esac

          version=$(node -p "require('./package.json').version")
          # 文件名由 electron-builder.yml 的 artifactName 决定，SignPath 签名配置里也按这个名字匹配
          installer="SmartSub_Windows_${version}_x64.exe"

          if [[ -n "$policy" ]]; then
            if [[ ! -f "dist/$installer" ]]; then
              echo "::error::Expected installer dist/$installer was not found"
              ls -la dist
              exit 1
            fi
            if [[ "$policy" == "release-signing" ]]; then
              wait_seconds=7200
            else
              wait_seconds=900
            fi
            echo "Signing the Windows installer with SignPath policy: $policy"
          else
            echo "SignPath signing is off for this run; the Windows installer stays unsigned."
          fi

          {
            echo "policy=$policy"
            echo "version=$version"
            echo "installer=$installer"
            echo "wait_seconds=${wait_seconds:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer (for SignPath)
        id: unsigned
        if: matrix.os_build_arg == 'win' && steps.signing.outputs.policy != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: dist/${{ steps.signing.outputs.installer }}
          retention-days: 1
          overwrite: true # 签名失败后重新运行时，上一次的同名产物会冲突
          if-no-files-found: error

      - name: Sign Windows installer (SignPath)
        id: signpath
        if: matrix.os_build_arg == 'win' && steps.signing.outputs.policy != ''
        # 固定到提交而不是浮动标签：这个 action 能拿到签名令牌，升级要有意为之
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: SmartSub
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: ${{ steps.signing.outputs.wait_seconds }}
          output-artifact-directory: ${{ github.workspace }}/signed
          parameters: |
            version: "${{ steps.signing.outputs.version }}"

      - name: Link the SignPath signing request
        if: always() && matrix.os_build_arg == 'win' && steps.signpath.outputs.signing-request-web-url != ''
        shell: bash
        env:
          REQUEST_URL: ${{ steps.signpath.outputs.signing-request-web-url }}
          POLICY: ${{ steps.signing.outputs.policy }}
        run: |
          echo "SignPath signing request ($POLICY): $REQUEST_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Swap in the signed installer and refresh latest.yml
        if: matrix.os_build_arg == 'win' && steps.signing.outputs.policy != ''
        shell: bash
        env:
          INSTALLER: ${{ steps.signing.outputs.installer }}
        run: |
          if [[ ! -f "signed/$INSTALLER" ]]; then
            echo "::error::SignPath did not return $INSTALLER"
            ls -la signed || true
            exit 1
          fi
          # 必须先用未签名的文件算出旧校验值，再覆盖
          node scripts/refresh-update-checksum.mjs \
            --yml dist/latest.yml \
            --unsigned "dist/$INSTALLER" \
            --signed "signed/$INSTALLER"
          cp "signed/$INSTALLER" "dist/$INSTALLER"

      - name: Verify Authenticode signature
        if: matrix.os_build_arg == 'win' && steps.signing.outputs.policy != ''
        shell: pwsh
        env:
          INSTALLER: ${{ steps.signing.outputs.installer }}
          POLICY: ${{ steps.signing.outputs.policy }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "dist/$env:INSTALLER"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Issuer: $($sig.SignerCertificate.Issuer)"
          if ($null -eq $sig.SignerCertificate) {
            throw "The installer carries no Authenticode signature."
          }
          # 测试证书不在受信任根里，Status 不会是 Valid；正式证书必须是 Valid
          if ($env:POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') {
            throw "Release signature is not valid: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir staging
          cp dist/*.{dmg,exe,AppImage,zip,tar.gz,deb,snap} staging/ 2>/dev/null || true # Copy main packages
          cp dist/*latest*.yml staging/ 2>/dev/null || true # Copy generated YML
          ls -R staging # List files for debugging

      - name: Upload application package artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-pkg-${{ matrix.artifact_suffix }}
          path: |
            staging/*.dmg
            staging/*.exe
            staging/*.AppImage
            staging/*.zip
            staging/*.tar.gz
            staging/*.deb
            staging/*.snap
          retention-days: 1
          if-no-files-found: error # Important: fail if no package found

      - name: Upload update YAML artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-yaml-${{ matrix.artifact_suffix }}
          path: staging/*latest*.yml
          retention-days: 1
          if-no-files-found: error # Important: fail if no YML found

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build_artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Required for softprops/action-gh-release
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # 只下载发布需要的产物，不能「全部下载」：
      # Windows 签名时上传过一份未签名安装包（unsigned-windows-installer），它和已签名的安装包同名，
      # 一起下载会覆盖已签名的文件，Release 里就成了未签名的包，
      # 而 latest.yml 里是已签名文件的 sha512，所有 Windows 用户的自动更新都会校验失败。
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-pkg-*
          path: all_build_artifacts # 每个产物下载到各自的子目录

      - name: Download update YAML artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: update-yaml-*
          path: all_build_artifacts

      - name: List downloaded artifacts for debugging
        run: ls -R all_build_artifacts

      - name: Create YAML merge script
        run: |
          cat <<'EOF' > merge-yaml-and-prepare-release.js
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');

          const artifactsDownloadDir = path.join('.', 'all_build_artifacts');
          const finalReleaseAssetsDir = path.join('.', 'final_release_assets');
          fs.mkdirSync(finalReleaseAssetsDir, { recursive: true });

          const platformYamlData = { mac: [], windows: [], linux: [] };
          let packageVersion = process.env.GITHUB_REF_NAME.startsWith('v') ? process.env.GITHUB_REF_NAME.substring(1) : process.env.GITHUB_REF_NAME;

          fs.readdirSync(artifactsDownloadDir).forEach(artifactSubDir => {
            const artifactPath = path.join(artifactsDownloadDir, artifactSubDir);
            fs.readdirSync(artifactPath).forEach(file => {
              const filePath = path.join(artifactPath, file);
              if (file.endsWith('.yml')) {
                console.log(`Processing YAML: ${filePath} from ${artifactSubDir}`);
                try {
                  const ymlContent = yaml.load(fs.readFileSync(filePath, 'utf8'));
                  if (!packageVersion && ymlContent.version) packageVersion = ymlContent.version; // Fallback if GITHUB_REF_NAME is not a version tag

                  let platformKey = '';
                  if (artifactSubDir.includes('-macos-') || file.includes('-mac')) platformKey = 'mac';
                  else if (artifactSubDir.includes('-windows-') || file.includes('-windows') || file.includes('-win')) platformKey = 'windows';
                  else if (artifactSubDir.includes('-linux-') || file.includes('-linux')) platformKey = 'linux';
                  
                  if (platformKey && ymlContent.files && Array.isArray(ymlContent.files)) {
                    ymlContent.files.forEach(fileEntry => {
                      // Ensure the URL is just the filename for the release asset
                      fileEntry.url = path.basename(fileEntry.url);
                      platformYamlData[platformKey].push(fileEntry);
                    });
                  } else {
                    console.warn(`Could not determine platform or parse files for ${filePath}`);
                  }
                } catch (e) {
                  console.error(`Error processing YAML file ${filePath}:`, e);
                }
              } else {
                console.log(`Copying package: ${file} to ${finalReleaseAssetsDir}`);
                fs.copyFileSync(filePath, path.join(finalReleaseAssetsDir, file));
              }
            });
          });

          const releaseDate = new Date().toISOString();

          for (const platform of ['mac', 'windows', 'linux']) {
            if (platformYamlData[platform].length > 0) {
              // Sort files to ensure deterministic order, e.g., by URL
              platformYamlData[platform].sort((a, b) => a.url.localeCompare(b.url));

              let outputFileName = `latest-${platform}.yml`;
              if (platform === 'windows') {
                outputFileName = 'latest.yml';
              }

              const finalYaml = {
                version: packageVersion,
                files: platformYamlData[platform],
                path: outputFileName, // Use the determined output file name
                releaseDate: releaseDate,
              };
              const yamlPath = path.join(finalReleaseAssetsDir, outputFileName);
              fs.writeFileSync(yamlPath, yaml.dump(finalYaml));
              console.log(`Generated ${yamlPath} for ${platform} with ${finalYaml.files.length} entries.`);
            }
          }
          console.log('Final release assets prepared in:', finalReleaseAssetsDir);
          EOF

      - name: Install script dependencies
        run: npm install js-yaml

      - name: Run YAML merge script
        run: node merge-yaml-and-prepare-release.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }} # Pass tag to script

      - name: List final assets for debugging
        run: ls -R final_release_assets

      - name: Check if beta release
        id: check_beta
        run: |
          if [[ "${{ github.ref_name }}" == *"beta"* ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve release notes
        id: notes
        run: |
          NOTES="Changelog/${{ github.ref_name }}-release-note.md"
          TITLE="${{ github.ref_name }}"

          if [[ -f "$NOTES" ]]; then
            HEADING=$(grep -m1 '^# ' "$NOTES" | sed 's/^# //')
            if [[ -n "$HEADING" ]]; then
              TITLE="$HEADING"
            fi
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using release notes from $NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No changelog found at $NOTES; release body will be empty"
          fi

          # Multiline-safe: title may contain emoji / CJK
          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2 # Updated to a newer version
        with:
          # token: ${{ secrets.GITHUB_TOKEN }} # Provided by default
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: ${{ steps.check_beta.outputs.is_beta == 'true' }}
          prerelease: ${{ steps.check_beta.outputs.is_beta == 'true' }}
          files: |
            final_release_assets/*

  update_homebrew_tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: publish_release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'beta')
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download macOS DMG files and calculate SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Download ARM64 DMG
          echo "Downloading ARM64 DMG..."
          curl -L -o "SmartSub_Mac_${VERSION}_arm64.dmg" \
            "https://github.com/buxuku/SmartSub/releases/download/v${VERSION}/SmartSub_Mac_${VERSION}_arm64.dmg"

          # Download x64 DMG
          echo "Downloading x64 DMG..."
          curl -L -o "SmartSub_Mac_${VERSION}_x64.dmg" \
            "https://github.com/buxuku/SmartSub/releases/download/v${VERSION}/SmartSub_Mac_${VERSION}_x64.dmg"

          # Calculate SHA256
          SHA256_ARM64=$(shasum -a 256 "SmartSub_Mac_${VERSION}_arm64.dmg" | awk '{print $1}')
          SHA256_X64=$(shasum -a 256 "SmartSub_Mac_${VERSION}_x64.dmg" | awk '{print $1}')

          echo "SHA256 ARM64: $SHA256_ARM64"
          echo "SHA256 x64: $SHA256_X64"

          echo "sha256_arm64=$SHA256_ARM64" >> $GITHUB_OUTPUT
          echo "sha256_x64=$SHA256_X64" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: buxuku/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256_ARM64="${{ steps.sha256.outputs.sha256_arm64 }}"
          SHA256_X64="${{ steps.sha256.outputs.sha256_x64 }}"

          CASK_FILE="homebrew-tap/Casks/smartsub.rb"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"

          # Update SHA256 for Intel (x64) - appears first in on_intel block
          sed -i "/on_intel do/,/end/ s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA256_X64}\"/" "$CASK_FILE"

          # Update SHA256 for ARM - appears in on_arm block
          sed -i "/on_arm do/,/end/ s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA256_ARM64}\"/" "$CASK_FILE"

          echo "Updated Cask file:"
          cat "$CASK_FILE"

      - name: Commit and Push changes
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Casks/smartsub.rb

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update smartsub to ${{ steps.version.outputs.version }}"
            git push
            echo "Successfully updated homebrew-tap"
          fi
