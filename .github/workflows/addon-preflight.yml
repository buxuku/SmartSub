# TEMPORARY — only for verifying issue #547; do not merge into main.
#
# 在合并任何东西到 whisper.cpp 的 builder 分支之前，先在 CI 里回答三个问题（用的是 tmp/nccl-off 上的真实脚本和 workflow 文本）：
#   1. 守卫脚本在【真实的 readelf（nvidia/cuda devel 镜像）】上：已知坏包被拒、已知好包通过？
#   2. builder.yml 里新的 "Copy CUDA libs" 在真实的 devel 镜像里：三个库真的进了 Full 包？
#   3. 这个 Full 包放进【没有 CUDA toolkit 的干净容器】，SmartSub 的加载方式能找到包里的库吗？
name: addon-preflight (temporary)

on:
  push:
    branches: [tmp/verify-nccl-addon]
    paths:
      - .github/workflows/addon-preflight.yml
      - .github/addon-preflight/**

permissions:
  contents: read

concurrency:
  group: addon-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  WCPP_REPO: buxuku/whisper.cpp
  # 被测的构建脚本所在分支（whisper.cpp 的临时分支，不是 builder）
  WCPP_REF: tmp/nccl-off
  # 已知坏包：2026-10-13 的构建，带 libnccl.so.2（固定 tag，不用会变的 latest）
  BAD_TAG: release-20261013-135642
  # 已知好包：引入 NCCL 之前的最后一次构建
  GOOD_TAG: release-20260611-130108

jobs:
  preflight:
    name: cuda-${{ matrix.cuda }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.4.0'
            asset: '1240'
          - cuda: '13.0.2'
            asset: '1302'
    steps:
      - name: Checkout the preflight scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/addon-preflight

      - name: Checkout whisper.cpp ${{ env.WCPP_REF }} (the build scripts under test)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WCPP_REPO }}
          ref: ${{ env.WCPP_REF }}
          path: wcpp
          sparse-checkout: |
            .github/scripts
            .github/workflows

      - name: Show the commit under test
        run: git -C wcpp log --oneline -4

      - name: Fetch the known-bad and known-good published addons
        run: |
          mkdir -p work/in
          for kind in bad good; do
            if [ "$kind" = bad ]; then tag="$BAD_TAG"; else tag="$GOOD_TAG"; fi
            url="https://github.com/$WCPP_REPO/releases/download/$tag/addon-linux-cuda-${{ matrix.asset }}-optimized.node.gz"
            echo "$kind <- $url"
            curl -fL --retry 3 -o "work/in/$kind.node.gz" "$url"
            gunzip -f "work/in/$kind.node.gz"
          done
          ls -l work/in
          sha256sum work/in/*.node

      - name: "Stage 1: inside nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04 (the image build-linux uses)"
        run: |
          docker run --rm \
            -e CUDA_VERSION=${{ matrix.cuda }} -e ASSET_VER=${{ matrix.asset }} \
            -v "$PWD/work:/work" -v "$PWD/wcpp:/wcpp:ro" -v "$PWD/.github/addon-preflight:/pf:ro" \
            nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04 bash /pf/devel-stage.sh

      - name: "Stage 2: clean Debian 12 + Node 22 (no CUDA toolkit, no NCCL)"
        run: |
          docker run --rm \
            -v "$PWD/work:/work" -v "$PWD/.github/addon-preflight:/pf:ro" \
            node:22-bookworm-slim bash /pf/clean-stage.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### CUDA ${{ matrix.cuda }} — tmp/nccl-off @ $(git -C wcpp rev-parse --short HEAD)"
            for f in devel clean; do
              [ -f "work/out/$f-results.tsv" ] || continue
              echo
              echo "**$f stage**"
              echo
              echo "| check | expected | actual | verdict | note |"
              echo "|---|---|---|---|---|"
              awk -F'\t' '{ n=$5; gsub(/\|/,"\\|",n); printf "| %s | %s | %s | %s | %s |\n", $1,$2,$3,$4,substr(n,1,160) }' "work/out/$f-results.tsv"
            done
          } >>"$GITHUB_STEP_SUMMARY"
